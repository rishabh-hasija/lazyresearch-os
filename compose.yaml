services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lazyresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
      POSTGRES_DB: lazyresearch_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lazyresearch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazyresearch -d lazyresearch_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  lazyresearch_postgres:
