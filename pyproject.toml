[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyresearch-os"
version = "0.1.0"
description = "Evidence-preserving research domain foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6.1,<7",
    "pydantic>=2.10,<3",
    "temporalio>=1.34,<2",
]

[project.optional-dependencies]
ranking = ["tabpfn==2.2.1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["integration: requires an isolated real PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Frozen scalar-only configuration is safe as an argument default.
extend-immutable-calls = ["lazyresearch.application.intake_models.IntakeLimits"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
